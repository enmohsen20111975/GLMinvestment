name: Architecture Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # architecture-guard — enforce the DAL pattern via AST scanner
  # ─────────────────────────────────────────────────────────────────────
  architecture-guard:
    name: DAL Enforcement Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run DAL enforcement scanner (strict)
        run: python3 scripts/check_architecture.py --strict

      - name: Run architecture tests
        working-directory: vps-service
        run: python3 -m pytest tests/test_architecture.py -v --tb=short

  # ─────────────────────────────────────────────────────────────────────
  # syntax-check — make sure every .py file at least parses
  # ─────────────────────────────────────────────────────────────────────
  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile every .py file (excluding archives)
        run: |
          set -e
          errors=0
          for f in $(find vps-service scripts data_engine -name '*.py' \
                      -not -path '*/archive/*' \
                      -not -path '*/garage/*' \
                      -not -path '*/__pycache__/*'); do
            if ! python3 -m py_compile "$f"; then
              echo "❌ syntax error in $f"
              errors=$((errors+1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo ""
            echo "❌ $errors file(s) failed to compile."
            exit 1
          fi
          echo "✅ All Python files compile cleanly."
