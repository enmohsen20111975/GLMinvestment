# GLMinvestment — CI Pipeline
# P2-11 FIX (2026-10-14): Added CI workflow for automated quality gates.
# Runs on every push to main + every PR to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: TypeScript (src/ only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bunx prisma generate --schema=prisma/auth-schema.prisma
      - run: bunx prisma generate --schema=prisma/predictions-schema.prisma
      - name: Type check (src/ only — excludes scripts/ and examples/)
        run: bunx tsc --noEmit --skipLibCheck --project tsconfig.json 2>&1 | grep "^src/" || true

  python-compile:
    name: Python py_compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all touched Python files
        run: |
          find vps-service/ -name "*.py" -not -path "*/venv/*" -not -path "*/__pycache__/*" | while read f; do
            python3 -m py_compile "$f" || { echo "FAILED: $f"; exit 1; }
          done
          echo "All Python files compile successfully."

  security-check:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets
        run: |
          # Check for common secret patterns
          if grep -rn "sk-[a-f0-9]\{32\}" --include="*.py" --include="*.ts" --include="*.js" --include="*.md" .; then
            echo "❌ Found hardcoded API key pattern (sk-...). Remove it and use env vars."
            exit 1
          fi
          if grep -rn "ghp_[a-zA-Z0-9]\{36\}" --include="*.py" --include="*.ts" --include="*.js" --include="*.md" .; then
            echo "❌ Found hardcoded GitHub token pattern (ghp_...). Remove it and use env vars."
            exit 1
          fi
          echo "✅ No hardcoded secrets found."
