# Complexity Guardrails — SIMPLIFICATION_PLAN PHASE 7-A (v3.53.0)
# ====================================================================
# Prevents complexity from creeping back into the codebase.
#
# Three checks (all must pass):
#   1. --max-lines 600    — no NEW files > 600 lines (grandfathered: 287 files)
#   2. --no-inline-sql    — no NEW inline SQL on restricted tables outside data/
#                           (grandfathered: 148 file:table pairs)
#   3. --no-new-god-files — god_files_backend count ≤ 207 (baseline)
#
# Also runs audit_map.py --fail-if-regressed to catch metric regressions:
#   - god_files_*, price_reader_functions, inline_sql_outside_data,
#     deprecated_hits, duplicate_function_names, suspected_dead_imports
#
# If a check fails, either:
#   - Split the offending file (PHASE 3)
#   - Replace inline SQL with data/prices.py or data/analyses.py helpers
#   - OR regenerate baseline: python3 scripts/check_complexity.py --write-baseline
#     (only if the addition is intentional + documented in the commit)

name: Complexity Guardrails

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run audit_map.py (produce metrics)
        run: |
          python3 scripts/audit_map.py --json-only

      - name: Run audit_map.py --fail-if-regressed (no metric regression)
        run: |
          # Save current as prev for first run, then check
          if [ ! -f Documentation/audit_map.prev.json ]; then
            cp Documentation/audit_map.json Documentation/audit_map.prev.json
          fi
          python3 scripts/audit_map.py --fail-if-regressed

      - name: Run check_complexity.py (all 3 guardrails)
        run: |
          python3 scripts/check_complexity.py
